name: Test Docker Swarm Environment (without sudo)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-docker-swarm-no-sudo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add user to docker group
      run: |
        sudo usermod -aG docker $USER

    - name: Initialize Docker Swarm (with sudo)
      run: |
        sudo docker swarm init
        sudo docker node ls

    - name: Create test services in Swarm (with sudo)
      run: |
        # Create a simple service to test detection
        sudo docker service create --name test-nginx --replicas 2 nginx:alpine

        # Wait for services to be running
        sleep 10
        sudo docker service ls
        sudo docker service ps test-nginx

    - name: Verify Docker Swarm status (with sudo)
      run: |
        sudo docker info | grep -i swarm -A 10

    - name: Install jq for JSON validation
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Configure docker socket permissions
      run: |
        # Make docker socket accessible to the user
        sudo chmod 666 /var/run/docker.sock || true

    - name: Run discovery script without sudo
      run: |
        # Run in new shell to pick up group membership
        sg docker -c './GuestDetails_Container.sh'

    - name: Run unprivileged test
      run: sg docker -c './test_unprivileged.sh'

    - name: Validate JSON output
      run: |
        if [ -f output.json ]; then
          echo "JSON output exists"
          jq . output.json > /dev/null
          echo "JSON is valid"

          # Check that script completed without crashing
          runtime_count=$(jq '.armResources[0].properties.container_runtimes | length' output.json)
          echo "Container runtimes detected: $runtime_count"

          orch_count=$(jq '.armResources[0].properties.orchestrators | length' output.json)
          echo "Orchestrators detected: $orch_count"

          # Try to detect Docker Swarm even without sudo
          swarm_count=$(jq '.armResources[0].properties.orchestrators | map(select(.orchestrator_type == "docker_swarm")) | length' output.json)
          echo "Docker Swarm orchestrators detected: $swarm_count"

          if [ "$swarm_count" -gt 0 ]; then
            echo "✓ Docker Swarm detected without sudo (via docker group)"
            jq '.armResources[0].properties.orchestrators[] | select(.orchestrator_type == "docker_swarm")' output.json
          else
            echo "⚠ Docker Swarm not detected (expected without sudo in some cases)"
          fi

          echo "✓ Script completed successfully without sudo"
        else
          echo "✗ output.json not found"
          exit 1
        fi

    - name: Cleanup Docker Swarm
      if: always()
      run: |
        sudo docker service rm test-nginx || true
        sudo docker swarm leave --force || true

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-swarm-no-sudo-test-results
        path: |
          output.json
          debug.txt
          error.txt
        retention-days: 7

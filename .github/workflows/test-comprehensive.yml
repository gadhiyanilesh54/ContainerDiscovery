name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [kubernetes, docker-swarm]
        privilege: [sudo, no-sudo]

    name: Test ${{ matrix.environment }} (${{ matrix.privilege }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kubernetes with kind
      if: matrix.environment == 'kubernetes'
      uses: helm/kind-action@v1
      with:
        cluster_name: test-cluster
        wait: 5m

    - name: Verify Kubernetes cluster
      if: matrix.environment == 'kubernetes'
      run: |
        kubectl cluster-info
        kubectl get nodes
        kubectl get pods -A

    - name: Initialize Docker Swarm
      if: matrix.environment == 'docker-swarm'
      run: |
        sudo docker swarm init
        sudo docker node ls
        sudo docker service create --name test-nginx --replicas 2 nginx:alpine
        sleep 10

    - name: Install jq for JSON validation
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Install crictl for Kubernetes
      if: matrix.environment == 'kubernetes'
      run: |
        VERSION="v1.28.0"
        wget -q https://github.com/kubernetes-sigs/cri-tools/releases/download/$VERSION/crictl-$VERSION-linux-amd64.tar.gz
        sudo tar zxvf crictl-$VERSION-linux-amd64.tar.gz -C /usr/local/bin
        rm -f crictl-$VERSION-linux-amd64.tar.gz
        sudo sh -c 'cat > /etc/crictl.yaml <<'"'"'EOF'"'"'
        runtime-endpoint: unix:///run/containerd/containerd.sock
        image-endpoint: unix:///run/containerd/containerd.sock
        timeout: 10
        EOF'"'"

    - name: Configure for non-sudo execution
      if: matrix.privilege == 'no-sudo'
      run: |
        # Set up kubeconfig for non-root user (Kubernetes)
        if [ "${{ matrix.environment }}" = "kubernetes" ]; then
          mkdir -p $HOME/.kube
          sudo cp /root/.kube/config $HOME/.kube/config 2>/dev/null || cp ~/.kube/config $HOME/.kube/config || true
          sudo chown $(id -u):$(id -g) $HOME/.kube/config 2>/dev/null || true
          chmod 600 $HOME/.kube/config 2>/dev/null || true
        fi

        # Configure docker socket for non-root user (Docker Swarm)
        if [ "${{ matrix.environment }}" = "docker-swarm" ]; then
          sudo usermod -aG docker $USER
          sudo chmod 666 /var/run/docker.sock || true
        fi

    - name: Run discovery script with sudo
      if: matrix.privilege == 'sudo'
      run: sudo ./GuestDetails_Container.sh

    - name: Run discovery script without sudo
      if: matrix.privilege == 'no-sudo'
      run: |
        if [ "${{ matrix.environment }}" = "docker-swarm" ]; then
          sg docker -c './GuestDetails_Container.sh'
        else
          ./GuestDetails_Container.sh
        fi

    - name: Run privileged test
      if: matrix.privilege == 'sudo'
      run: sudo ./test_privileged.sh

    - name: Run unprivileged test
      if: matrix.privilege == 'no-sudo'
      run: |
        if [ "${{ matrix.environment }}" = "docker-swarm" ]; then
          sg docker -c './test_unprivileged.sh'
        else
          ./test_unprivileged.sh
        fi

    - name: Run Kubernetes fields validation
      if: matrix.environment == 'kubernetes' && matrix.privilege == 'sudo'
      run: ./test_kubernetes_fields.sh

    - name: Run comprehensive validation
      if: matrix.privilege == 'sudo'
      run: ./test_validation_comprehensive.sh

    - name: Run fallback mechanisms test
      run: ./test_fallback_mechanisms.sh

    - name: Validate Kubernetes detection
      if: matrix.environment == 'kubernetes' && matrix.privilege == 'sudo'
      run: |
        k8s_count=$(jq '.armResources[0].properties.orchestrators | map(select(.orchestrator_type == "kubernetes")) | length' output.json)
        echo "Kubernetes orchestrators detected: $k8s_count"
        if [ "$k8s_count" -gt 0 ]; then
          echo "✓ Kubernetes successfully detected"
          jq '.armResources[0].properties.orchestrators[] | select(.orchestrator_type == "kubernetes")' output.json
        else
          echo "✗ Kubernetes not detected"
          exit 1
        fi

    - name: Validate Docker Swarm detection
      if: matrix.environment == 'docker-swarm' && matrix.privilege == 'sudo'
      run: |
        swarm_count=$(jq '.armResources[0].properties.orchestrators | map(select(.orchestrator_type == "docker_swarm")) | length' output.json)
        echo "Docker Swarm orchestrators detected: $swarm_count"
        if [ "$swarm_count" -gt 0 ]; then
          echo "✓ Docker Swarm successfully detected"
          jq '.armResources[0].properties.orchestrators[] | select(.orchestrator_type == "docker_swarm")' output.json
        else
          echo "✗ Docker Swarm not detected"
          exit 1
        fi

    - name: Validate script completed
      run: |
        if [ -f output.json ]; then
          echo "✓ JSON output exists"
          jq . output.json > /dev/null
          echo "✓ JSON is valid"
        else
          echo "✗ output.json not found"
          exit 1
        fi

    - name: Cleanup Docker Swarm
      if: always() && matrix.environment == 'docker-swarm'
      run: |
        sudo docker service rm test-nginx || true
        sudo docker swarm leave --force || true

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.environment }}-${{ matrix.privilege }}
        path: |
          output.json
          debug.txt
          error.txt
        retention-days: 7
